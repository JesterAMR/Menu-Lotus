<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Lotus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo-lotus.jpeg" alt="Logo Lotus Cafetería" class="logo-img">
        <p class="subtitulo">Menú Digital</p>
    </header>

    <nav class="categorias" id="botones-categorias">
        <button class="btn-filtro activo" onclick="filtrar('Todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrar('Promociones')">Promociones</button>
        <button class="btn-filtro" onclick="filtrar('Postres')">Postres</button>
        <button class="btn-filtro" onclick="filtrar('Sándwich')">Sándwich</button>
        <button class="btn-filtro" onclick="filtrar('Bebidas Calientes')">Bebidas Calientes</button>
        <button class="btn-filtro" onclick="filtrar('Bebidas Frías')">Bebidas Frías</button>
        <button class="btn-filtro" onclick="filtrar('Limonadas')">Limonadas</button>
        <button class="btn-filtro" onclick="filtrar('Smoothies')">Smoothies</button>
        <button class="btn-filtro" onclick="filtrar('Frappuccinos')">Frappuccinos</button>
    </nav>

    <main id="contenedor-menu" class="grid-menu">
        </main>

    <script src="script.js"></script>
</body>
</html>
